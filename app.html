<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kho Lưu Trữ — Trang chính</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">Kho Lưu Trữ</span>
      </div>
      <div class="topbar-right">
        <span id="user-email" class="user-email"></span>
        <button id="logout-btn" class="btn-ghost">Đăng xuất</button>
      </div>
    </header>

    <main class="main-content">
      <section class="panel-row">
        <div id="dropzone" class="dropzone">
          <input type="file" id="file-input" hidden>
          <div class="dropzone-inner">
            <span class="dropzone-icon">↑</span>
            <p class="dropzone-text">Kéo thả file vào đây, hoặc <button id="browse-btn" class="link-btn">chọn file</button></p>
            <p class="dropzone-hint">Tối đa 50MB mỗi file</p>
          </div>
        </div>

        <div class="search-box">
          <label for="search-input" class="search-label">Tìm file</label>
          <input type="text" id="search-input" placeholder="Nhập tên file cần tìm…" autocomplete="off">
          <p class="file-count"><span id="file-count-num">0</span> file trong kho</p>
        </div>
      </section>

      <div id="upload-status" class="upload-status hidden"></div>

      <section class="file-list-section">
        <table class="file-table">
          <thead>
            <tr>
              <th>Tên file</th>
              <th class="col-size">Kích thước</th>
              <th class="col-date">Ngày tải lên</th>
              <th class="col-actions"></th>
            </tr>
          </thead>
          <tbody id="file-list-body">
          </tbody>
        </table>
        <div id="empty-state" class="empty-state hidden">
          <p>Chưa có file nào.</p>
          <p class="empty-sub">Kéo thả hoặc chọn file phía trên để bắt đầu.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
