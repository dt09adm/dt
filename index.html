<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shop Hkhai07 - Auto Key 24/7</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-main: #070913;
      --card-bg: #111428;
      --card-border: #1d2242;
      --accent-purple: #8b5cf6;
      --accent-orange: #f97316;
      --text-main: #ffffff;
      --text-muted: #808aab;
      --danger-red: #ef4444;
      --success-green: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background-color: #020307; color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: radial-gradient(circle at top, #141733 0%, #060814 80%);
      position: relative;
      padding-bottom: 80px;
      min-height: 100vh;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }

    .hidden { display: none !important; }

    /* AUTH SCREEN */
    .auth-overlay { padding: 30px 20px; display: flex; flex-direction: column; justify-content: center; min-height: 100vh; }
    .auth-header { text-align: center; margin-bottom: 24px; }
    .auth-header h2 { font-size: 24px; color: var(--accent-purple); margin-bottom: 6px; }
    .auth-header p { font-size: 13px; color: var(--text-muted); }
    .auth-tabs { display: flex; background: #111428; border: 1px solid var(--card-border); border-radius: 12px; margin-bottom: 20px; padding: 4px; }
    .auth-tab { flex: 1; padding: 10px; border: none; background: none; color: var(--text-muted); font-weight: 700; font-size: 13px; cursor: pointer; border-radius: 8px; }
    .auth-tab.active { background: var(--accent-purple); color: white; }
    .auth-form { display: flex; flex-direction: column; gap: 14px; }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 12px; color: var(--text-muted); }
    .input-group input { background: #151833; border: 1px solid #23284c; border-radius: 10px; padding: 12px; color: white; font-size: 14px; outline: none; }
    .btn-auth { background: linear-gradient(135deg, var(--accent-purple), #6d28d9); border: none; color: white; padding: 12px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 10px; }
    .auth-message { font-size: 12px; text-align: center; margin-top: 10px; min-height: 18px; }
    .auth-message.error { color: var(--danger-red); }
    .auth-message.success { color: var(--success-green); }

    /* HEADER */
    .profile-header { position: sticky; top: 0; z-index: 99; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(18, 17, 39, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 14px; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-avatar { width: 42px; height: 42px; border-radius: 50%; background: #3b82f6; overflow: hidden; border: 2px solid rgba(255, 255, 255, 0.15); }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-details .name { font-size: 13px; font-weight: 700; max-width: 130px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-details .id { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .balance-pill { background: #141622; border: 1px solid #3d3113; color: #eab308; padding: 6px 12px; border-radius: 20px; font-weight: 800; font-size: 13px; }

    /* CARDS */
    .form-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 14px; margin: 0 14px 12px 14px; }
    .form-header { display: flex; justify-content: space-between; align-items: center; }
    .form-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; text-transform: uppercase; }
    .form-title i { color: var(--accent-purple); background: rgba(139, 92, 246, 0.15); padding: 6px; border-radius: 8px; }

    /* PACKAGE GRID */
    .package-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .pkg-card { background: #151833; border: 1px solid #23284c; border-radius: 14px; padding: 14px 10px; text-align: center; cursor: pointer; position: relative; }
    .pkg-card.selected { border-color: #38bdf8; background: rgba(56, 189, 248, 0.08); box-shadow: 0 0 12px rgba(56, 189, 248, 0.2); }
    .pkg-name { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
    .pkg-price { font-size: 14px; font-weight: 800; color: #f97316; }

    .btn-submit { width: calc(100% - 28px); margin: 0 14px 14px 14px; height: 48px; border-radius: 12px; border: none; background: linear-gradient(135deg, #f97316, #ea580c); color: white; font-weight: 800; font-size: 15px; cursor: pointer; box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3); }

    /* ITEM HISTORY CARD */
    .key-card { background: #10142b; border: 1px solid #1e244d; border-radius: 12px; padding: 12px; margin: 0 14px 8px 14px; display: flex; justify-content: space-between; align-items: center; }
    .key-info h5 { font-size: 13px; font-weight: 700; color: #38bdf8; }
    .key-info p { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .btn-copy-key { background: #8b5cf6; border: none; color: white; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; }

    /* DEPOSIT SECTION */
    .amount-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .amount-btn { background: #161b3b; border: 1px solid #232a5c; border-radius: 10px; padding: 12px 6px; text-align: center; font-size: 13px; font-weight: 800; cursor: pointer; }
    .amount-btn.active { border-color: var(--accent-orange); color: #f97316; background: rgba(249, 115, 22, 0.1); }

    /* BOTTOM NAV */
    .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; height: 60px; background: #060814; border-top: 1px solid #16182e; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
    .nav-btn { background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; cursor: pointer; width: 25%; }
    .nav-btn.active { color: var(--accent-purple); font-weight: bold; }
    .nav-btn i { font-size: 16px; }

    /* MODAL */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); z-index: 1000; display: flex; justify-content: center; align-items: flex-end; }
    .modal-content { width: 100%; max-width: 480px; background: #0c0e1e; border-radius: 20px 20px 0 0; padding: 20px 16px 24px 16px; border-top: 1px solid #23284c; }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- AUTH SCREEN -->
    <div id="authScreen" class="auth-overlay">
      <div class="auth-header">
        <h2>Shop Hkhai07</h2>
        <p>Hệ thống bán Key Game Auto 24/7</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLoginBtn" onclick="switchAuthTab('login')">Đăng nhập</button>
        <button class="auth-tab" id="tabSignupBtn" onclick="switchAuthTab('signup')">Đăng ký</button>
      </div>

      <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="nhap@email.com" required>
        </div>
        <div class="input-group">
          <label>Mật khẩu</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-auth">ĐĂNG NHẬP</button>
      </form>

      <form id="signupForm" class="auth-form hidden" onsubmit="handleSignup(event)">
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="signupEmail" placeholder="nhap@email.com" required>
        </div>
        <div class="input-group">
          <label>Mật khẩu</label>
          <input type="password" id="signupPassword" placeholder="Tối thiểu 6 ký tự" required>
        </div>
        <button type="submit" class="btn-auth">TẠO TÀI KHOẢN</button>
      </form>

      <div id="authMessage" class="auth-message"></div>
    </div>

    <!-- MAIN SHOP SCREEN -->
    <div id="mainShopScreen" class="hidden">
      <!-- Header Cố Định -->
      <div class="profile-header">
        <div class="user-info">
          <div class="user-avatar">
            <img id="userAvatar" src="" alt="avatar">
          </div>
          <div class="user-details">
            <div class="name" id="userDisplayName">Đang tải...</div>
            <div class="id" id="userIdDisplay">ID: ---</div>
          </div>
        </div>
        <div class="balance-pill"><span id="userBalance">0</span>đ</div>
      </div>

      <!-- TAB 1: MUA KEY -->
      <div id="tab-buy" class="tab-content">
        <div class="form-card">
          <div class="form-title" style="margin-bottom: 10px;"><i class="fa-solid fa-gamepad"></i><span>CHỌN GÓI KEY</span></div>
          <div class="package-grid">
            <div class="pkg-card selected" onclick="selectPackage(60000, 'Gói 3 Ngày', this)">
              <div class="pkg-name">3 Ngày</div>
              <div class="pkg-price">60.000đ</div>
            </div>
            <div class="pkg-card" onclick="selectPackage(120000, 'Gói 7 Ngày', this)">
              <div class="pkg-name">7 Ngày</div>
              <div class="pkg-price">120.000đ</div>
            </div>
          </div>
        </div>
        <button class="btn-submit" onclick="handleBuyKey()">XÁC NHẬN MUA KEY</button>
      </div>

      <!-- TAB 2: LỊCH SỬ MUA KEY (ĐÃ KHÔI PHỤC) -->
      <div id="tab-history" class="tab-content hidden">
        <div class="form-card">
          <div class="form-title"><i class="fa-solid fa-clock-rotate-left"></i><span>KEY ĐÃ MUA</span></div>
        </div>
        <div id="keyListContainer"></div>
      </div>

      <!-- TAB 3: NẠP TIỀN -->
      <div id="tab-deposit" class="tab-content hidden">
        <div class="form-card">
          <div class="form-title"><i class="fa-solid fa-coins"></i><span>CHỌN SỐ TIỀN NẠP</span></div>
          <div class="amount-grid">
            <div class="amount-btn active" onclick="selectAmount(10000, this)">10.000đ</div>
            <div class="amount-btn" onclick="selectAmount(50000, this)">50.000đ</div>
            <div class="amount-btn" onclick="selectAmount(100000, this)">100.000đ</div>
          </div>
        </div>
        <button class="btn-submit" onclick="openQrModal()">TẠO MÃ QR NẠP TIỀN</button>
      </div>

      <!-- TAB 4: CÁ NHÂN -->
      <div id="tab-account" class="tab-content hidden">
        <div class="form-card">
          <div class="form-title" style="margin-bottom: 12px;"><i class="fa-solid fa-user"></i><span>TÀI KHOẢN</span></div>
          <button class="btn-auth" style="background: #ef4444;" onclick="handleLogout()">ĐĂNG XUẤT</button>
        </div>
      </div>

      <!-- Bottom Navigation Bar -->
      <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchNavTab('buy', this)"><i class="fa-solid fa-key"></i><span>Mua Key</span></button>
        <button class="nav-btn" onclick="switchNavTab('history', this)"><i class="fa-solid fa-list"></i><span>Kho Key</span></button>
        <button class="nav-btn" onclick="switchNavTab('deposit', this)"><i class="fa-solid fa-wallet"></i><span>Nạp Tiền</span></button>
        <button class="nav-btn" onclick="switchNavTab('account', this)"><i class="fa-solid fa-user"></i><span>Cá Nhân</span></button>
      </div>
    </div>

    <!-- MODAL QR -->
    <div id="qrModal" class="modal-overlay hidden">
      <div class="modal-content" style="text-align: center;">
        <h3 style="color: #f97316; margin-bottom: 10px;">QUÉT MÃ VIETQR</h3>
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">Nội dung CK: <strong id="modalMemoText" style="color:#38bdf8;">---</strong></p>
        <div style="background: white; padding: 10px; border-radius: 12px; display: inline-block;">
          <img id="qrImageEl" src="" alt="QR" style="width: 200px; height: 200px;">
        </div>
        <button class="btn-auth" style="margin-top: 15px; width: 100%;" onclick="closeQrModal()">ĐÓNG</button>
      </div>
    </div>

  </div>

  <script src="config.js"></script>
  <script>
    let currentUser = null;
    let userProfile = { balance: 0, total_spent: 0, total_orders: 0 };
    let selectedPackagePrice = 60000;
    let selectedPackageName = 'Gói 3 Ngày';
    let selectedDepositAmount = 10000;

    window.onload = async function() {
      if (typeof supabaseClient !== 'undefined' && supabaseClient) {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          currentUser = session.user;
          await loadUserProfile();
          showMainShop();
        } else {
          showAuthScreen();
        }
      }
    };

    async function loadUserProfile() {
      if (!currentUser) return;
      const { data } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
      if (data) {
        userProfile = data;
        updateUIProfile();
      }
    }

    function updateUIProfile() {
      const emailName = currentUser.email ? currentUser.email.split('@')[0] : 'User';
      document.getElementById('userDisplayName').innerText = emailName;
      document.getElementById('userIdDisplay').innerText = `ID: ${currentUser.id.substring(0, 8).toUpperCase()}`;
      document.getElementById('userAvatar').src = `https://api.dicebear.com/7.x/bottts/svg?seed=${emailName}`;
      document.getElementById('userBalance').innerText = userProfile.balance.toLocaleString('vi-VN');
    }

    function showAuthScreen() {
      document.getElementById('authScreen').classList.remove('hidden');
      document.getElementById('mainShopScreen').classList.add('hidden');
    }

    function showMainShop() {
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('mainShopScreen').classList.remove('hidden');
      loadPurchasedKeys();
    }

    function switchAuthTab(tab) {
      if (tab === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('signupForm').classList.add('hidden');
        document.getElementById('tabLoginBtn').classList.add('active');
        document.getElementById('tabSignupBtn').classList.remove('active');
      } else {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('signupForm').classList.remove('hidden');
        document.getElementById('tabSignupBtn').classList.add('active');
        document.getElementById('tabLoginBtn').classList.remove('active');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value
      });
      if (!error) {
        currentUser = data.user;
        await loadUserProfile();
        showMainShop();
      } else alert(error.message);
    }

    async function handleSignup(e) {
      e.preventDefault();
      const { error } = await supabaseClient.auth.signUp({
        email: document.getElementById('signupEmail').value,
        password: document.getElementById('signupPassword').value
      });
      if (!error) {
        alert('Đăng ký thành công! Hãy đăng nhập.');
        switchAuthTab('login');
      } else alert(error.message);
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      showAuthScreen();
    }

    function switchNavTab(tabName, btnEl) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      btnEl.classList.add('active');
      if (tabName === 'history') loadPurchasedKeys();
    }

    function selectPackage(price, name, el) {
      selectedPackagePrice = price;
      selectedPackageName = name;
      document.querySelectorAll('.pkg-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
    }

    async function handleBuyKey() {
      if (userProfile.balance < selectedPackagePrice) {
        alert('Số dư không đủ! Vui lòng nạp thêm.');
        return;
      }

      const generatedKey = 'HKHAI-' + Math.random().toString(36).substring(2, 10).toUpperCase();
      const newBalance = userProfile.balance - selectedPackagePrice;

      // Cập nhật số dư & Lưu Key
      await supabaseClient.from('profiles').update({ balance: newBalance }).eq('id', currentUser.id);
      await supabaseClient.from('orders').insert({
        user_id: currentUser.id,
        package_name: selectedPackageName,
        key_code: generatedKey,
        price: selectedPackagePrice
      });

      userProfile.balance = newBalance;
      updateUIProfile();
      alert(`Mua thành công!\nMã Key: ${generatedKey}`);
    }

    async function loadPurchasedKeys() {
      const { data } = await supabaseClient.from('orders').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
      const container = document.getElementById('keyListContainer');
      container.innerHTML = '';

      if (!data || data.length === 0) {
        container.innerHTML = '<p style="text-align:center; font-size:12px; color:var(--text-muted);">Chưa có mã Key nào</p>';
        return;
      }

      data.forEach(item => {
        container.innerHTML += `
          <div class="key-card">
            <div class="key-info">
              <h5>${item.key_code}</h5>
              <p>${item.package_name} • ${new Date(item.created_at).toLocaleDateString('vi-VN')}</p>
            </div>
            <button class="btn-copy-key" onclick="navigator.clipboard.writeText('${item.key_code}'); alert('Đã chép Key!');">COPY</button>
          </div>
        `;
      });
    }

    function selectAmount(amt, el) {
      selectedDepositAmount = amt;
      document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }

    function openQrModal() {
      const memo = 'NAP' + Math.random().toString(36).substring(2, 8).toUpperCase();
      const qrUrl = `https://img.vietqr.io/image/MB-0345042406-compact2.png?amount=${selectedDepositAmount}&addInfo=${memo}&accountName=HUYNH%20THI%20BICH%20LAN`;
      document.getElementById('modalMemoText').innerText = memo;
      document.getElementById('qrImageEl').src = qrUrl;
      document.getElementById('qrModal').classList.remove('hidden');
    }

    function closeQrModal() {
      document.getElementById('qrModal').classList.add('hidden');
    }
  </script>
</body>
</html>
