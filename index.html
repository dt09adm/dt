<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Đăng nhập Thật</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .auth-container { background: #16213e; width: 100%; max-width: 400px; border-radius: 12px; padding: 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); color: #fff; }
        h2 { text-align: center; margin-bottom: 20px; color: #e94560; }
        .tab-header { display: flex; margin-bottom: 20px; border-bottom: 1px solid #0f3460; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: #8d99ae; font-weight: bold; cursor: pointer; }
        .tab-btn.active { color: #e94560; border-bottom: 2px solid #e94560; }
        .form-box { display: none; }
        .form-box.active { display: block; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #a2a8d3; }
        .input-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #0f3460; background: #0f3460; color: #fff; outline: none; }
        .btn-submit { width: 100%; padding: 12px; background: #e94560; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background: #d63447; }
        .divider { text-align: center; margin: 15px 0; color: #8d99ae; font-size: 12px; }
        .social-btn { width: 100%; padding: 10px; background: #fff; color: #333; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .user-info { display: none; text-align: center; }
        .user-info img { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="auth-container">
    <!-- KHU VỰC KHI CHƯA ĐĂNG NHẬP -->
    <div id="auth-section">
        <div class="tab-header">
            <button class="tab-btn active" onclick="switchTab('login')">Đăng nhập</button>
            <button class="tab-btn" onclick="switchTab('register')">Đăng ký</button>
        </div>

        <!-- FORM ĐĂNG NHẬP THẬT -->
        <div id="login-form" class="form-box active">
            <h2>Đăng Nhập</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="input-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn-submit">Đăng nhập</button>
            </form>
            <div class="divider">HOẶC</div>
            <button class="social-btn" onclick="loginWithGoogle()">
                <i class="fa-brands fa-google" style="color: #ea4335;"></i> Đăng nhập bằng Google
            </button>
        </div>

        <!-- FORM ĐĂNG KÝ THẬT -->
        <div id="register-form" class="form-box">
            <h2>Đăng Ký Tài Khoản</h2>
            <form id="registerForm">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" required>
                </div>
                <div class="input-group">
                    <label>Mật khẩu (Tối thiểu 6 ký tự)</label>
                    <input type="password" id="regPassword" required minlength="6">
                </div>
                <button type="submit" class="btn-submit">Tạo tài khoản</button>
            </form>
        </div>
    </div>

    <!-- KHU VỰC HIỂN THỊ KHI ĐÃ ĐĂNG NHẬP THÀNH CÔNG -->
    <div id="user-section" class="user-info">
        <h2>Xin chào!</h2>
        <img id="userAvatar" src="" alt="Avatar" style="display:none;">
        <p id="userEmail" style="margin-bottom: 20px;"></p>
        <button class="btn-submit" onclick="logout()">Đăng xuất</button>
    </div>
</div>

<!-- NHÚNG FIREBASE SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
        getAuth, 
        createUserWithEmailAndPassword, 
        signInWithEmailAndPassword, 
        signInWithPopup, 
        GoogleAuthProvider, 
        onAuthStateChanged, 
        signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // -------------------------------------------------------------------
    // BƯỚC BẮT BUỘC: Thay thế cấu hình bên dưới bằng API Key thật của bạn từ Firebase Console
    // -------------------------------------------------------------------
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // Khởi tạo Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // 1. Kiểm tra trạng thái đăng nhập tự động
    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('user-section').style.display = 'block';
            document.getElementById('userEmail').innerText = user.email;
            if (user.photoURL) {
                const img = document.getElementById('userAvatar');
                img.src = user.photoURL;
                img.style.display = 'inline-block';
            }
        } else {
            document.getElementById('auth-section').style.display = 'block';
            document.getElementById('user-section').style.display = 'none';
        }
    });

    // 2. Xử lý Đăng ký bằng Email/Mật khẩu thật
    document.getElementById('registerForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;

        createUserWithEmailAndPassword(auth, email, password)
            .then(() => alert("Đăng ký thành công!"))
            .catch((error) => alert("Lỗi đăng ký: " + error.message));
    });

    // 3. Xử lý Đăng nhập bằng Email/Mật khẩu thật
    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        signInWithEmailAndPassword(auth, email, password)
            .then(() => alert("Đăng nhập thành công!"))
            .catch((error) => alert("Lỗi đăng nhập: " + error.message));
    });

    // 4. Xử lý Đăng nhập bằng Google thật
    window.loginWithGoogle = () => {
        signInWithPopup(auth, provider)
            .then(() => alert("Đăng nhập Google thành công!"))
            .catch((error) => alert("Lỗi Google Auth: " + error.message));
    };

    // 5. Xử lý Đăng xuất
    window.logout = () => {
        signOut(auth).then(() => alert("Đã đăng xuất!"));
    };

    // Chuyển tab Giao diện
    window.switchTab = (tab) => {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.form-box').forEach(box => box.classList.remove('active'));
        
        if (tab === 'login') {
            document.getElementById('login-form').classList.add('active');
            event.target.classList.add('active');
        } else {
            document.getElementById('register-form').classList.add('active');
            event.target.classList.add('active');
        }
    };
</script>

</body>
</html>
