<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dt09 - Quản Trị Hệ Thống Full</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-main: #060814;
      --card-bg: #111428;
      --card-border: #1d2242;
      --accent-purple: #8b5cf6;
      --accent-orange: #f97316;
      --text-main: #ffffff;
      --text-muted: #808aab;
      --danger-red: #ef4444;
      --success-green: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #020307; color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 10px; }

    .admin-container { width: 100%; max-width: 600px; background: #060814; padding-bottom: 40px; }
    .header-title { font-size: 20px; font-weight: 800; color: var(--accent-purple); margin-bottom: 16px; text-align: center; text-transform: uppercase; }

    /* MENU TAB ADMIN */
    .admin-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px; }
    .tab-btn { background: #111428; border: 1px solid #1d2242; color: var(--text-muted); padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 11px; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: var(--accent-purple); color: white; border-color: var(--accent-purple); }

    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    .card-title { font-size: 14px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
    .card-title i { color: var(--accent-purple); }

    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .input-group input, .input-group select { width: 100%; background: #151833; border: 1px solid #23284c; border-radius: 8px; padding: 10px; color: white; font-size: 13px; outline: none; }

    .btn { width: 100%; background: linear-gradient(135deg, var(--accent-purple), #6d28d9); border: none; color: white; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; margin-top: 6px; }
    .btn-edit { background: #eab308; color: #000; padding: 6px 10px; border-radius: 6px; border: none; font-size: 11px; font-weight: 700; cursor: pointer; }
    .btn-delete { background: var(--danger-red); color: white; padding: 6px 10px; border-radius: 6px; border: none; font-size: 11px; font-weight: 700; cursor: pointer; }
    .btn-cancel { background: #374151; color: white; padding: 10px; border-radius: 8px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 6px; }

    .item-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .list-item { background: #0c0e1e; border: 1px solid #1e2448; border-radius: 10px; padding: 10px; display: flex; align-items: center; justify-content: space-between; }
    .item-info { display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .item-info img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; background: #151833; }
    .item-text { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
    .item-text .title { font-size: 13px; font-weight: 700; }
    .item-text .sub { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
    .item-actions { display: flex; gap: 6px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="header-title"><i class="fa-solid fa-user-shield"></i> Quản Lý Hệ Thống Admin</div>

    <!-- TABS ĐIỀU HƯỚNG -->
    <div class="admin-tabs">
      <button class="tab-btn active" onclick="switchAdminTab('apps', this)">Game & App</button>
      <button class="tab-btn" onclick="switchAdminTab('users', this)">Người Dùng</button>
      <button class="tab-btn" onclick="switchAdminTab('codes', this)">Giftcode/Voucher</button>
      <button class="tab-btn" onclick="switchAdminTab('orders', this)">Lịch Sử Nạp</button>
    </div>

    <!-- TAB 1: QUẢN LÝ GAME & APP -->
    <div id="tab-apps" class="admin-tab-content">
      <!-- QUẢN LÝ GAME -->
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-gamepad"></i> <span id="gameFormTitle">Thêm Game Mới</span></div>
        <input type="hidden" id="editGameId">
        
        <div class="input-group">
          <label>Tên Game</label>
          <input type="text" id="gameNameInput" placeholder="Ví dụ: Roblox, Liên Quân...">
        </div>
        <div class="input-group">
          <label>Link Ảnh Icon Game</label>
          <input type="text" id="gameIconInput" placeholder="https://domain.com/icon.png">
        </div>
        
        <button class="btn" id="btnSaveGame" onclick="saveGame()">LƯU GAME</button>
        <button class="btn-cancel hidden" id="btnCancelGame" onclick="resetGameForm()">HỦY CHỈNH SỬA</button>

        <div style="margin-top: 14px; font-size: 12px; font-weight: 700; color: var(--text-muted);">DANH SÁCH GAME:</div>
        <div class="item-list" id="gameListContainer">Đang tải...</div>
      </div>

      <!-- QUẢN LÝ APP / MOD -->
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-cube"></i> <span id="appFormTitle">Thêm App / Mod Link</span></div>
        <input type="hidden" id="editAppId">

        <div class="input-group">
          <label>Thuộc Game</label>
          <select id="appGameSelect"></select>
        </div>
        <div class="input-group">
          <label>Tên App / Bản Mod</label>
          <input type="text" id="appNameInput" placeholder="Ví dụ: Delta X, Arceus X, VNG Mod...">
        </div>
        <div class="input-group">
          <label>Link Ảnh Icon App</label>
          <input type="text" id="appIconInput" placeholder="https://domain.com/app-icon.png">
        </div>
        <div class="input-group">
          <label>Link Tải Xuống (URL)</label>
          <input type="text" id="appUrlInput" placeholder="https://mediafire.com/file...">
        </div>

        <button class="btn" id="btnSaveApp" onclick="saveApp()">LƯU BẢN APP</button>
        <button class="btn-cancel hidden" id="btnCancelApp" onclick="resetAppForm()">HỦY CHỈNH SỬA</button>

        <div style="margin-top: 14px; font-size: 12px; font-weight: 700; color: var(--text-muted);">DANH SÁCH APP:</div>
        <div class="item-list" id="appListContainer">Đang tải...</div>
      </div>
    </div>

    <!-- TAB 2: QUẢN LÝ NGƯỜI DÙNG & CỘNG TIỀN -->
    <div id="tab-users" class="admin-tab-content hidden">
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-users"></i> <span>Quản Lý Người Dùng & Số Dư</span></div>
        <div class="input-group">
          <label>Chọn User</label>
          <select id="userSelect" onchange="onUserSelectChange()"></select>
        </div>
        <div class="input-group">
          <label>Số tiền thay đổi (+ hoặc -)</label>
          <input type="number" id="userBalanceChange" placeholder="Ví dụ: 50000 hoặc -20000">
        </div>
        <div class="input-group">
          <label>Số lượt quay cộng thêm</label>
          <input type="number" id="userSpinChange" placeholder="Ví dụ: 5">
        </div>
        <button class="btn" onclick="updateUserBalanceAndSpin()">CẬP NHẬT CHO USER</button>

        <div style="margin-top: 14px; font-size: 12px; font-weight: 700; color: var(--text-muted);">DANH SÁCH USER HỆ THỐNG:</div>
        <div class="item-list" id="userListContainer">Đang tải...</div>
      </div>
    </div>

    <!-- TAB 3: QUẢN LÝ GIFTCODE & VOUCHER -->
    <div id="tab-codes" class="admin-tab-content hidden">
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-ticket"></i> <span>Tạo Mã Giftcode / Voucher</span></div>
        <div class="input-group">
          <label>Mã Code (Chữ hoa)</label>
          <input type="text" id="codeNameInput" placeholder="Ví dụ: DT09FREE, TRIENNGAY...">
        </div>
        <div class="input-group">
          <label>Loại Phần Thưởng</label>
          <select id="codeTypeSelect">
            <option value="money">Cộng Số Dư (VNĐ)</option>
            <option value="spin">Cộng Lượt Quay VQMM</option>
          </select>
        </div>
        <div class="input-group">
          <label>Giá Trị Phần Thưởng</label>
          <input type="number" id="codeValueInput" placeholder="Ví dụ: 20000 hoặc 5 (lượt quay)">
        </div>
        <button class="btn" onclick="createGiftcode()">TẠO MÃ CODE</button>

        <div style="margin-top: 14px; font-size: 12px; font-weight: 700; color: var(--text-muted);">DANH SÁCH MÃ HIỆN CÓ:</div>
        <div class="item-list" id="codeListContainer">Đang tải...</div>
      </div>
    </div>

    <!-- TAB 4: QUẢN LÝ LỊCH SỬ NẠP / ĐƠN HÀNG -->
    <div id="tab-orders" class="admin-tab-content hidden">
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-receipt"></i> <span>Lịch Sử Giao Dịch Nạp</span></div>
        <div class="item-list" id="orderListContainer">Đang tải...</div>
      </div>
    </div>

  </div>

  <script src="config.js"></script>
  <script>
    let gamesData = [];
    let appsData = [];
    let usersData = [];

    window.onload = async function() {
      await loadAllData();
    };

    async function loadAllData() {
      await fetchGames();
      await fetchApps();
      await fetchUsers();
      await fetchGiftcodes();
      await fetchOrders();
    }

    function switchAdminTab(tab, btnEl) {
      document.querySelectorAll('.admin-tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      btnEl.classList.add('active');
    }

    // --- 1. XỬ LÝ GAME (THÊM / SỬA / XÓA) ---
    async function fetchGames() {
      const container = document.getElementById('gameListContainer');
      const select = document.getElementById('appGameSelect');

      const { data, error } = await supabaseClient.from('games').select('*').order('id', { ascending: true });
      if (error) return container.innerHTML = 'Lỗi tải game!';

      gamesData = data || [];
      container.innerHTML = '';
      select.innerHTML = '';

      if (gamesData.length === 0) {
        container.innerHTML = '<div style="font-size:12px; color:var(--text-muted);">Chưa có game nào</div>';
        return;
      }

      gamesData.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g.game_name;
        opt.innerText = g.game_name;
        select.appendChild(opt);

        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div class="item-info">
            <img src="${g.icon_url || 'https://via.placeholder.com/40'}" onerror="this.src='https://via.placeholder.com/40'">
            <div class="item-text">
              <div class="title">${g.game_name}</div>
            </div>
          </div>
          <div class="item-actions">
            <button class="btn-edit" onclick="editGame(${g.id})"><i class="fa-solid fa-pen"></i> Sửa</button>
            <button class="btn-delete" onclick="deleteGame(${g.id})"><i class="fa-solid fa-trash"></i> Xóa</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    async function saveGame() {
      const id = document.getElementById('editGameId').value;
      const game_name = document.getElementById('gameNameInput').value.trim();
      const icon_url = document.getElementById('gameIconInput').value.trim();

      if (!game_name) return alert('Vui lòng nhập tên game!');

      if (id) {
        const { error } = await supabaseClient.from('games').update({ game_name, icon_url }).eq('id', id);
        if (error) alert('Lỗi cập nhật: ' + error.message);
        else alert('Đã cập nhật game!');
      } else {
        const { error } = await supabaseClient.from('games').insert([{ game_name, icon_url }]);
        if (error) alert('Lỗi thêm: ' + error.message);
        else alert('Đã thêm game mới!');
      }

      resetGameForm();
      loadAllData();
    }

    function editGame(id) {
      const g = gamesData.find(item => item.id === id);
      if (!g) return;

      document.getElementById('editGameId').value = g.id;
      document.getElementById('gameNameInput').value = g.game_name;
      document.getElementById('gameIconInput').value = g.icon_url || '';

      document.getElementById('gameFormTitle').innerText = 'Chỉnh Sửa Game';
      document.getElementById('btnSaveGame').innerText = 'CẬP NHẬT GAME';
      document.getElementById('btnCancelGame').classList.remove('hidden');
    }

    function resetGameForm() {
      document.getElementById('editGameId').value = '';
      document.getElementById('gameNameInput').value = '';
      document.getElementById('gameIconInput').value = '';

      document.getElementById('gameFormTitle').innerText = 'Thêm Game Mới';
      document.getElementById('btnSaveGame').innerText = 'LƯU GAME';
      document.getElementById('btnCancelGame').classList.add('hidden');
    }

    async function deleteGame(id) {
      if (!confirm('Xóa Game này?')) return;
      const { error } = await supabaseClient.from('games').delete().eq('id', id);
      if (error) alert('Lỗi xóa: ' + error.message);
      else { alert('Đã xóa!'); loadAllData(); }
    }

    // --- 2. XỬ LÝ APP (THÊM / SỬA / XÓA) ---
    async function fetchApps() {
      const container = document.getElementById('appListContainer');
      const { data, error } = await supabaseClient.from('app_links').select('*').order('id', { ascending: true });
      if (error) return container.innerHTML = 'Lỗi tải app!';

      appsData = data || [];
      container.innerHTML = '';

      if (appsData.length === 0) {
        container.innerHTML = '<div style="font-size:12px; color:var(--text-muted);">Chưa có app nào</div>';
        return;
      }

      appsData.forEach(app => {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div class="item-info">
            <img src="${app.icon_url || 'https://via.placeholder.com/40'}" onerror="this.src='https://via.placeholder.com/40'">
            <div class="item-text">
              <div class="title">${app.app_name} <span style="font-size:10px; color:var(--accent-purple);">(${app.game_name})</span></div>
              <div class="sub">${app.download_url}</div>
            </div>
          </div>
          <div class="item-actions">
            <button class="btn-edit" onclick="editApp(${app.id})"><i class="fa-solid fa-pen"></i> Sửa</button>
            <button class="btn-delete" onclick="deleteApp(${app.id})"><i class="fa-solid fa-trash"></i> Xóa</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    async function saveApp() {
      const id = document.getElementById('editAppId').value;
      const game_name = document.getElementById('appGameSelect').value;
      const app_name = document.getElementById('appNameInput').value.trim();
      const icon_url = document.getElementById('appIconInput').value.trim();
      const download_url = document.getElementById('appUrlInput').value.trim();

      if (!app_name || !download_url) return alert('Điền đủ Tên App và Link Tải!');

      if (id) {
        const { error } = await supabaseClient.from('app_links').update({ game_name, app_name, icon_url, download_url }).eq('id', id);
        if (error) alert('Lỗi cập nhật app: ' + error.message);
        else alert('Đã cập nhật App!');
      } else {
        const { error } = await supabaseClient.from('app_links').insert([{ game_name, app_name, icon_url, download_url }]);
        if (error) alert('Lỗi thêm app: ' + error.message);
        else alert('Đã thêm App!');
      }

      resetAppForm();
      fetchApps();
    }

    function editApp(id) {
      const app = appsData.find(item => item.id === id);
      if (!app) return;

      document.getElementById('editAppId').value = app.id;
      document.getElementById('appGameSelect').value = app.game_name;
      document.getElementById('appNameInput').value = app.app_name;
      document.getElementById('appIconInput').value = app.icon_url || '';
      document.getElementById('appUrlInput').value = app.download_url || '';

      document.getElementById('appFormTitle').innerText = 'Chỉnh Sửa App / Link';
      document.getElementById('btnSaveApp').innerText = 'CẬP NHẬT APP';
      document.getElementById('btnCancelApp').classList.remove('hidden');
    }

    function resetAppForm() {
      document.getElementById('editAppId').value = '';
      document.getElementById('appNameInput').value = '';
      document.getElementById('appIconInput').value = '';
      document.getElementById('appUrlInput').value = '';

      document.getElementById('appFormTitle').innerText = 'Thêm App / Mod Link';
      document.getElementById('btnSaveApp').innerText = 'LƯU BẢN APP';
      document.getElementById('btnCancelApp').classList.add('hidden');
    }

    async function deleteApp(id) {
      if (!confirm('Xóa bản App này?')) return;
      const { error } = await supabaseClient.from('app_links').delete().eq('id', id);
      if (error) alert('Lỗi xóa: ' + error.message);
      else { alert('Đã xóa App!'); fetchApps(); }
    }

    // --- 3. XỬ LÝ NGƯỜI DÙNG & CỘNG TIỀN ---
    async function fetchUsers() {
      const container = document.getElementById('userListContainer');
      const select = document.getElementById('userSelect');

      const { data, error } = await supabaseClient.from('profiles').select('*');
      if (error) return container.innerHTML = 'Lỗi tải user!';

      usersData = data || [];
      container.innerHTML = '';
      select.innerHTML = '<option value="">-- Chọn User --</option>';

      usersData.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.id;
        opt.innerText = `${u.email} (Số dư: ${u.balance || 0}đ)`;
        select.appendChild(opt);

        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div class="item-info">
            <div class="item-text">
              <div class="title">${u.email}</div>
              <div class="sub">Số dư: <span style="color:#eab308; font-weight:bold;">${(u.balance || 0).toLocaleString()}đ</span> | VQ: ${u.spin_count || 0} lượt</div>
            </div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function onUserSelectChange() {}

    async function updateUserBalanceAndSpin() {
      const userId = document.getElementById('userSelect').value;
      const balanceAdd = parseInt(document.getElementById('userBalanceChange').value || 0, 10);
      const spinAdd = parseInt(document.getElementById('userSpinChange').value || 0, 10);

      if (!userId) return alert('Vui lòng chọn User!');

      const user = usersData.find(u => u.id === userId);
      if (!user) return;

      const newBal = (user.balance || 0) + balanceAdd;
      const newSpin = (user.spin_count || 0) + spinAdd;

      const { error } = await supabaseClient.from('profiles').update({ balance: newBal, spin_count: newSpin }).eq('id', userId);
      if (error) alert('Lỗi cập nhật: ' + error.message);
      else {
        alert('Cập nhật người dùng thành công!');
        document.getElementById('userBalanceChange').value = '';
        document.getElementById('userSpinChange').value = '';
        fetchUsers();
      }
    }

    // --- 4. XỬ LÝ GIFTCODE ---
    async function fetchGiftcodes() {
      const container = document.getElementById('codeListContainer');
      const { data, error } = await supabaseClient.from('giftcodes').select('*');
      if (error) return container.innerHTML = 'Lỗi tải giftcode!';

      container.innerHTML = '';
      if (!data || data.length === 0) {
        container.innerHTML = '<div style="font-size:12px; color:var(--text-muted);">Chưa có mã nào</div>';
        return;
      }

      data.forEach(c => {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div class="item-info">
            <div class="item-text">
              <div class="title" style="color:var(--accent-purple);">${c.code}</div>
              <div class="sub">Loại: ${c.type} | Giá trị: ${c.value}</div>
            </div>
          </div>
          <button class="btn-delete" onclick="deleteGiftcode(${c.id})"><i class="fa-solid fa-trash"></i> Xóa</button>
        `;
        container.appendChild(item);
      });
    }

    async function createGiftcode() {
      const code = document.getElementById('codeNameInput').value.trim().toUpperCase();
      const type = document.getElementById('codeTypeSelect').value;
      const value = parseInt(document.getElementById('codeValueInput').value || 0, 10);

      if (!code || !value) return alert('Vui lòng điền mã và giá trị!');

      const { error } = await supabaseClient.from('giftcodes').insert([{ code, type, value }]);
      if (error) alert('Lỗi tạo mã: ' + error.message);
      else {
        alert('Đã tạo Giftcode thành công!');
        document.getElementById('codeNameInput').value = '';
        document.getElementById('codeValueInput').value = '';
        fetchGiftcodes();
      }
    }

    async function deleteGiftcode(id) {
      if (!confirm('Xóa mã này?')) return;
      await supabaseClient.from('giftcodes').delete().eq('id', id);
      fetchGiftcodes();
    }

    // --- 5. XỬ LÝ ĐƠN HÀNG / LỊCH SỬ NẠP ---
    async function fetchOrders() {
      const container = document.getElementById('orderListContainer');
      const { data, error } = await supabaseClient.from('orders').select('*').order('id', { ascending: false });
      if (error) return container.innerHTML = 'Lỗi tải lịch sử!';

      container.innerHTML = '';
      if (!data || data.length === 0) {
        container.innerHTML = '<div style="font-size:12px; color:var(--text-muted);">Chưa có lịch sử nạp</div>';
        return;
      }

      data.forEach(o => {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div class="item-info">
            <div class="item-text">
              <div class="title">Sô tiền: ${(o.amount || 0).toLocaleString()}đ</div>
              <div class="sub">Nội dung: ${o.memo || 'N/A'} | Status: ${o.status || 'Thành công'}</div>
            </div>
          </div>
        `;
        container.appendChild(item);
      });
    }
  </script>
</body>
</html>
