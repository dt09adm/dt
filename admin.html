<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>dt09 - Admin Control Panel</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-main: #060814;
      --card-bg: #111428;
      --card-border: #1d2242;
      --accent-purple: #8b5cf6;
      --accent-green: #10b981;
      --text-main: #ffffff;
      --text-muted: #808aab;
      --danger-red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #020307; color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 10px; }

    .admin-container {
      width: 100%;
      max-width: 500px;
      background: radial-gradient(circle at top, #181538 0%, #060814 80%);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; }
    .admin-header h2 { font-size: 18px; color: var(--accent-purple); display: flex; align-items: center; gap: 8px; }

    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 14px; }
    .card-title { font-size: 13px; font-weight: 800; text-transform: uppercase; color: #a78bfa; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .form-group label { font-size: 11px; color: var(--text-muted); font-weight: 700; }
    .form-control { background: #151833; border: 1px solid #23284c; border-radius: 10px; padding: 10px; color: white; font-size: 13px; outline: none; }
    
    .btn { border: none; padding: 10px 14px; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-green { background: linear-gradient(135deg, #059669, #10b981); color: white; }
    .btn-purple { background: linear-gradient(135deg, #7c3aed, #a855f7); color: white; }
    .btn-sm { padding: 6px 10px; font-size: 11px; }

    .img-preview { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; background: #1a1e3b; border: 1px solid #2d345e; }
    .preview-box { display: flex; align-items: center; gap: 10px; margin-top: 4px; }

    .user-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #151833; border: 1px solid #23284c; border-radius: 10px; margin-bottom: 8px; font-size: 12px; }
    .user-info div { margin-bottom: 2px; }
    .user-email { font-weight: 800; color: #38bdf8; }
    .user-balance { color: #eab308; font-weight: 800; }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-header">
      <h2><i class="fa-solid fa-user-shield"></i> dt09 Admin Panel</h2>
    </div>

    <!-- 1. THÊM / CẬP NHẬT DANH MỤC GAME -->
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-gamepad"></i> Thêm/Sửa Danh Mục Game</div>
      
      <div class="form-group">
        <label>Tên Game (ví dụ: Roblox, Free Fire...)</label>
        <input type="text" id="gameNameInput" class="form-control" placeholder="Nhập tên game">
      </div>
      
      <div class="form-group">
        <label>URL Link Ảnh/Icon Logo Game</label>
        <div class="preview-box">
          <input type="text" id="gameIconInput" class="form-control" style="flex:1" placeholder="https://..." oninput="updatePreview('gameIconInput', 'gameIconPreview')">
          <img id="gameIconPreview" class="img-preview" src="https://api.dicebear.com/7.x/identicon/svg?seed=Game" alt="preview">
        </div>
      </div>

      <button class="btn btn-purple" style="width: 100%;" onclick="saveGameCategory()">
        <i class="fa-solid fa-plus"></i> LƯU DANH MỤC GAME
      </button>
    </div>

    <!-- 2. THÊM / CẬP NHẬT ỨNG DỤNG HACK/TOOL -->
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-link"></i> Cập Nhật Ứng Dụng & Link Tải</div>
      
      <div class="form-group">
        <label>Thuộc Danh Mục Game</label>
        <select id="gameSelectDropdown" class="form-control"></select>
      </div>

      <div class="form-group">
        <label>Tên Ứng dụng / Tool (ví dụ: Delta Executor)</label>
        <input type="text" id="appNameInput" class="form-control" placeholder="Nhập tên ứng dụng">
      </div>

      <div class="form-group">
        <label>URL Link Ảnh/Icon Ứng Dụng</label>
        <div class="preview-box">
          <input type="text" id="appIconInput" class="form-control" style="flex:1" placeholder="https://..." oninput="updatePreview('appIconInput', 'appIconPreview')">
          <img id="appIconPreview" class="img-preview" src="https://api.dicebear.com/7.x/bottts/svg?seed=App" alt="preview">
        </div>
      </div>

      <div class="form-group">
        <label>Đường Link Tải Xuống (URL)</label>
        <input type="text" id="downloadUrlInput" class="form-control" placeholder="https://deltaexploits.gg/...">
      </div>

      <button class="btn btn-green" style="width: 100%;" onclick="saveAppLink()">
        <i class="fa-solid fa-floppy-disk"></i> LƯU ỨNG DỤNG & LINK TẢI
      </button>
    </div>

    <!-- 3. TẠO GIFTCODE -->
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-gift"></i> Tạo Mã Giftcode / Voucher</div>
      <div class="form-group">
        <label>Mã Code</label>
        <input type="text" id="gcCode" class="form-control" placeholder="Ví dụ: FREEMONEY">
      </div>
      <div class="form-group">
        <label>Loại Phần Thưởng</label>
        <select id="gcType" class="form-control">
          <option value="money">Cộng Tiền (VNĐ)</option>
          <option value="spin">Cộng Lượt Quay</option>
        </select>
      </div>
      <div class="form-group">
        <label>Giá Trị Phần Thưởng</label>
        <input type="number" id="gcValue" class="form-control" placeholder="10000">
      </div>
      <div class="form-group">
        <label>Số Lượt Sử Dụng Tối Đa</label>
        <input type="number" id="gcMaxUses" class="form-control" value="50">
      </div>
      <button class="btn btn-green" style="width: 100%; margin-top: 4px;" onclick="createGiftcode()">
        <i class="fa-solid fa-plus"></i> TẠO GIFTCODE
      </button>
    </div>

    <!-- 4. QUẢN LÝ THÀNH VIÊN -->
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-users"></i> Quản Lý Số Dư Thành Viên</div>
      <div id="userListContainer">Đang tải danh sách thành viên...</div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    window.onload = async function() {
      await loadGameDropdown();
      await loadUserList();
    };

    function updatePreview(inputId, imgId) {
      const url = document.getElementById(inputId).value.trim();
      if(url) {
        document.getElementById(imgId).src = url;
      }
    }

    // LOAD DANH SÁCH GAME VÀO DROPDOWN
    async function loadGameDropdown() {
      const dropdown = document.getElementById('gameSelectDropdown');
      dropdown.innerHTML = '';

      if (typeof supabaseClient === 'undefined') return;

      const { data: games } = await supabaseClient.from('games').select('*');
      
      let defaultGames = ['Free Fire', 'Roblox', 'Liên Quân', 'PUBG Mobile'];
      let gameSet = new Set(defaultGames);

      if (games) {
        games.forEach(g => gameSet.add(g.game_name));
      }

      gameSet.forEach(gName => {
        const opt = document.createElement('option');
        opt.value = gName;
        opt.innerText = gName;
        dropdown.appendChild(opt);
      });
    }

    // LƯU GAME VÀ LINK ĐẠI DIỆN GAME
    async function saveGameCategory() {
      const gameName = document.getElementById('gameNameInput').value.trim();
      const iconUrl = document.getElementById('gameIconInput').value.trim();

      if (!gameName) return alert("Vui lòng nhập tên game!");

      const { error } = await supabaseClient
        .from('games')
        .upsert([{ game_name: gameName, icon_url: iconUrl }], { onConflict: 'game_name' });

      if (error) {
        alert("Lỗi lưu game: " + error.message);
      } else {
        alert("🎉 Đã lưu danh mục Game thành công!");
        document.getElementById('gameNameInput').value = '';
        document.getElementById('gameIconInput').value = '';
        loadGameDropdown();
      }
    }

    // LƯU APP, LINK TẢI VÀ LINK ĐẠI DIỆN APP
    async function saveAppLink() {
      const gameName = document.getElementById('gameSelectDropdown').value;
      const appName = document.getElementById('appNameInput').value.trim();
      const iconUrl = document.getElementById('appIconInput').value.trim();
      const downloadUrl = document.getElementById('downloadUrlInput').value.trim();

      if (!appName || !downloadUrl) return alert("Vui lòng nhập tên ứng dụng và link tải!");

      const { error } = await supabaseClient
        .from('app_links')
        .insert([{ 
          game_name: gameName, 
          app_name: appName, 
          icon_url: iconUrl, 
          download_url: downloadUrl 
        }]);

      if (error) {
        alert("Lỗi cập nhật link tải: " + error.message);
      } else {
        alert("🎉 Đã lưu ứng dụng thành công!");
        document.getElementById('appNameInput').value = '';
        document.getElementById('appIconInput').value = '';
        document.getElementById('downloadUrlInput').value = '';
      }
    }

    // TẠO GIFTCODE
    async function createGiftcode() {
      const code = document.getElementById('gcCode').value.trim().toUpperCase();
      const type = document.getElementById('gcType').value;
      const value = parseInt(document.getElementById('gcValue').value, 10);
      const maxUses = parseInt(document.getElementById('gcMaxUses').value, 10);

      if (!code || isNaN(value)) return alert("Vui lòng nhập mã code và giá trị hợp lệ!");

      const { error } = await supabaseClient.from('giftcodes').insert([{
        code: code,
        type: type,
        value: value,
        max_uses: maxUses,
        used_count: 0
      }]);

      if (error) {
        alert("Lỗi tạo mã: " + error.message);
      } else {
        alert("🎉 Tạo Giftcode thành công!");
        document.getElementById('gcCode').value = '';
      }
    }

    // LOAD DANH SÁCH USER VÀ SỬA SỐ DƯ
    async function loadUserList() {
      const container = document.getElementById('userListContainer');
      const { data: profiles, error } = await supabaseClient.from('profiles').select('*');

      if (error || !profiles || profiles.length === 0) {
        container.innerHTML = '<div style="font-size: 12px; color: var(--text-muted);">Chưa có người dùng nào.</div>';
        return;
      }

      let html = '';
      profiles.forEach(u => {
        html += `
          <div class="user-item">
            <div class="user-info">
              <div class="user-email">${u.email || 'Không rõ Email'}</div>
              <div>Số dư: <span class="user-balance">${(u.balance || 0).toLocaleString('vi-VN')}đ</span> | Lượt quay: ${u.spin_count || 0}</div>
            </div>
            <button class="btn btn-purple btn-sm" onclick="editUser('${u.id}', ${u.balance || 0}, ${u.spin_count || 0})">Chỉnh sửa</button>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    async function editUser(userId, currentBal, currentSpin) {
      const newBal = prompt("Nhập số dư mới (VNĐ):", currentBal);
      if (newBal === null) return;
      
      const newSpin = prompt("Nhập số lượt quay mới:", currentSpin);
      if (newSpin === null) return;

      const { error } = await supabaseClient
        .from('profiles')
        .update({ balance: parseInt(newBal, 10), spin_count: parseInt(newSpin, 10) })
        .eq('id', userId);

      if (error) {
        alert("Cập nhật thất bại: " + error.message);
      } else {
        alert("Cập nhật thành công!");
        loadUserList();
      }
    }
  </script>
</body>
</html>
