<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - dt09</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg: #060814; --card: #111428; --accent: #8b5cf6; --text: #fff; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    h2 { color: var(--accent); margin-bottom: 16px; text-align: center; font-size: 20px; }
    .card { background: var(--card); border: 1px solid #1d2242; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    .card h3 { font-size: 15px; margin-bottom: 12px; color: #f97316; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    label { font-size: 12px; color: #808aab; }
    input, select, textarea { background: #151833; border: 1px solid #23284c; border-radius: 8px; padding: 10px; color: white; outline: none; font-size: 14px; }
    button { background: var(--accent); border: none; color: white; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 6px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .user-item { background: #151833; border: 1px solid #23284c; border-radius: 10px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .user-info { font-size: 12px; }
    .user-info .email { font-weight: bold; color: #fff; }
    .user-info .sub { color: #808aab; font-size: 11px; margin-top: 2px; }
    .btn-sm { width: auto; padding: 6px 12px; font-size: 12px; margin: 0; background: #3b82f6; }
  </style>
</head>
<body>

  <div class="container">
    <h2>QUẢN TRỊ VIÊN (ADMIN)</h2>

    <!-- DANH SÁCH TÀI KHOẢN -->
    <div class="card">
      <h3>1. Danh sách Khách hàng</h3>
      <button onclick="loadUsers()" style="background:#2563eb; margin-bottom:12px;">TẢI DANH SÁCH USER</button>
      <div id="userList">
        <p style="font-size:12px; color:#808aab; text-align:center;">Bấm nút để hiển thị danh sách người dùng...</p>
      </div>
    </div>

    <!-- CỘNG TIỀN THỦ CÔNG -->
    <div class="card">
      <h3>2. Cộng tiền theo ID / Email</h3>
      <div class="form-group">
        <label>Nhập ID hoặc Email:</label>
        <input type="text" id="targetUser" placeholder="f2d298d0 hoặc email...">
      </div>
      <div class="form-group">
        <label>Số tiền cần cộng (VND):</label>
        <input type="number" id="addBalanceAmount" placeholder="Ví dụ: 1000000">
      </div>
      <button id="btnBalance" onclick="addBalanceManual()">XÁC NHẬN CỘNG TIỀN</button>
    </div>

    <!-- THÊM KEY VÀO KHO -->
    <div class="card">
      <h3>3. Thêm Key Game Mới</h3>
      <div class="form-group">
        <label>Chọn Game:</label>
        <select id="keyGame">
          <option value="Free Fire ADR&PC">Free Fire ADR&PC</option>
          <option value="Free Fire IOS">Free Fire IOS</option>
          <option value="PUBG IOS">PUBG IOS</option>
        </select>
      </div>
      <div class="form-group">
        <label>Tên App:</label>
        <input type="text" id="keyApp" value="dt00">
      </div>
      <div class="form-group">
        <label>Gói cước:</label>
        <select id="keyPackage">
          <option value="3 Ngày">3 Ngày</option>
          <option value="7 Ngày">7 Ngày</option>
          <option value="15 Ngày">15 Ngày</option>
          <option value="30 Ngày">30 Ngày</option>
        </select>
      </div>
      <div class="form-group">
        <label>Mã Key (mỗi mã 1 dòng):</label>
        <textarea id="keyCodes" style="height:80px;"></textarea>
      </div>
      <button id="btnKey" onclick="uploadKeys()" style="background: #10b981;">THÊM KEY VÀO KHO</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    window.onload = function() {
      loadUsers();
    };

    // Tải danh sách tất cả tài khoản
    async function loadUsers() {
      const container = document.getElementById('userList');
      container.innerHTML = '<p style="font-size:12px; color:#808aab; text-align:center;">Đang tải...</p>';

      const { data, error } = await supabaseClient.from('profiles').select('*');

      if (error || !data || data.length === 0) {
        container.innerHTML = '<p style="font-size:12px; color:#ef4444; text-align:center;">Chưa có tài khoản nào hoặc lỗi tải dữ liệu.</p>';
        return;
      }

      container.innerHTML = '';
      data.forEach(u => {
        const div = document.createElement('div');
        div.className = 'user-item';
        div.innerHTML = `
          <div class="user-info">
            <div class="email">${u.email || 'Không có email'}</div>
            <div class="sub">ID: ${u.id.substring(0,8)} | Số dư: <b style="color:#eab308;">${Number(u.balance || 0).toLocaleString()}đ</b></div>
          </div>
          <button class="btn-sm" onclick="quickAdd('${u.id}', '${u.email}')">+ Tiền</button>
        `;
        container.appendChild(div);
      });
    }

    // Cộng tiền nhanh từ danh sách
    async function quickAdd(userId, email) {
      const amountStr = prompt(`Cộng tiền cho tài khoản: ${email}\nNhập số tiền (VND):`, '100000');
      if (!amountStr) return;
      const amount = parseFloat(amountStr);
      if (isNaN(amount)) return alert('Số tiền không hợp lệ!');

      const { data } = await supabaseClient.from('profiles').select('balance').eq('id', userId).single();
      const currentBalance = data ? Number(data.balance || 0) : 0;
      const newBalance = currentBalance + amount;

      const { error } = await supabaseClient.from('profiles').update({ balance: newBalance }).eq('id', userId);

      if (error) {
        alert('Lỗi: ' + error.message);
      } else {
        alert(`Đã cộng ${amount.toLocaleString()}đ thành công!`);
        loadUsers();
      }
    }

    // Cộng tiền bằng ô nhập thủ công
    async function addBalanceManual() {
      const input = document.getElementById('targetUser').value.trim();
      const amount = parseFloat(document.getElementById('addBalanceAmount').value);

      if (!input || isNaN(amount)) return alert('Vui lòng nhập ID/Email và Số tiền hợp lệ!');

      // Lấy tất cả user kiểm tra
      const { data } = await supabaseClient.from('profiles').select('*');
      if (!data) return alert('Không thể lấy dữ liệu!');

      const target = data.find(u => u.id.startsWith(input) || (u.email && u.email.toLowerCase().includes(input.toLowerCase())));

      if (!target) {
        alert('Không tìm thấy tài khoản với thông tin này!');
        return;
      }

      const newBalance = Number(target.balance || 0) + amount;
      const { error } = await supabaseClient.from('profiles').update({ balance: newBalance }).eq('id', target.id);

      if (error) {
        alert('Lỗi: ' + error.message);
      } else {
        alert(`Thành công! Đã cộng ${amount.toLocaleString()}đ cho ${target.email}`);
        document.getElementById('addBalanceAmount').value = '';
        loadUsers();
      }
    }

    // Nạp Key vào kho
    async function uploadKeys() {
      const game = document.getElementById('keyGame').value;
      const app = document.getElementById('keyApp').value;
      const pkg = document.getElementById('keyPackage').value;
      const rawKeys = document.getElementById('keyCodes').value.trim().split('\n');

      const keysToInsert = rawKeys.filter(k => k.trim() !== '').map(code => ({
        game_name: game,
        app_name: app,
        package_name: pkg,
        key_code: code.trim()
      }));

      if (keysToInsert.length === 0) return alert('Vui lòng nhập ít nhất 1 mã Key!');

      const { error } = await supabaseClient.from('keys_store').insert(keysToInsert);
      if (error) {
        alert('Lỗi thêm key: ' + error.message);
      } else {
        alert(`Đã thêm thành công ${keysToInsert.length} Key!`);
        document.getElementById('keyCodes').value = '';
      }
    }
  </script>
</body>
</html>
